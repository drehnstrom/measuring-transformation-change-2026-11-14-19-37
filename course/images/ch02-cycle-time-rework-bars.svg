<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" role="img" aria-label="Horizontal cycle time bars comparing an eight-hour baseline against a seven-point-five-hour speed-only rollout swollen by rework and a four-hour balanced rollout">
  <!-- Row 1: Pre-AI Baseline (6.0h draft + 2.0h review = 8.0h) -->
  <text x="176" y="61" text-anchor="end" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Pre-AI Baseline</text>
  <text x="176" y="77" text-anchor="end" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="11">Manual workflow</text>

  <rect x="190" y="42" width="390" height="44" rx="4" fill="#082445"/>
  <text x="385" y="69" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">6.0h manual draft</text>

  <rect x="582" y="42" width="128" height="44" rx="4" fill="#495f7a"/>
  <text x="646" y="69" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">2.0h review</text>

  <text x="720" y="69" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">8.0h</text>

  <!-- Row 2: Speed-Only Quota (1.5h AI draft + 6.0h rework = 7.5h) -->
  <text x="176" y="133" text-anchor="end" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Speed-Only Push</text>
  <text x="176" y="149" text-anchor="end" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="11">Unverified output</text>

  <rect x="190" y="114" width="96" height="44" rx="4" fill="#1e71d6"/>
  <text x="238" y="141" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">1.5h AI</text>

  <rect x="288" y="114" width="389" height="44" rx="4" fill="#bd35c2"/>
  <text x="482" y="141" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">6.0h downstream rework and fixes</text>

  <text x="688" y="141" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">7.5h</text>

  <!-- Row 3: Balanced Guardrails (2.5h guided AI + 1.5h QA = 4.0h) -->
  <text x="176" y="205" text-anchor="end" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Balanced Rollout</text>
  <text x="176" y="221" text-anchor="end" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="11">Playbook + QA check</text>

  <rect x="190" y="186" width="161" height="44" rx="4" fill="#1e71d6"/>
  <text x="270" y="213" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">2.5h guided AI</text>

  <rect x="353" y="186" width="97" height="44" rx="4" fill="#6a55e4"/>
  <text x="401" y="213" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">1.5h QA</text>

  <rect x="454" y="188" width="256" height="40" rx="4" fill="none" stroke="#1e71d6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="582" y="213" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">4.0h net (-50% cycle)</text>

  <!-- Bottom Hour Axis -->
  <line x1="190" y1="248" x2="710" y2="248" stroke="#495f7a" stroke-width="2"/>

  <line x1="190" y1="248" x2="190" y2="256" stroke="#495f7a" stroke-width="2"/>
  <text x="190" y="274" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="12">0h</text>

  <line x1="320" y1="248" x2="320" y2="256" stroke="#495f7a" stroke-width="2"/>
  <text x="320" y="274" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="12">2h</text>

  <line x1="450" y1="248" x2="450" y2="256" stroke="#495f7a" stroke-width="2"/>
  <text x="450" y="274" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="12">4h</text>

  <line x1="580" y1="248" x2="580" y2="256" stroke="#495f7a" stroke-width="2"/>
  <text x="580" y="274" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="12">6h</text>

  <line x1="710" y1="248" x2="710" y2="256" stroke="#495f7a" stroke-width="2"/>
  <text x="710" y="274" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="12">8h</text>
</svg>
