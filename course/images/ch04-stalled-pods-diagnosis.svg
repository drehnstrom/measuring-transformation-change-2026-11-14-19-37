<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" role="img" aria-label="Two Week-6 cohort diagnostic profiles across Level 2 Lab, Level 3 Habit, and Level 4 Cycle KPI showing Pod Alpha breaking between Level 2 at 95 percent and Level 3 at 18 percent while Pod Beta passes Level 2 at 91 percent and Level 3 at 78 percent before dropping 15 percent slower at Level 4">
  <!-- PANEL 1: Pod Alpha (Recruiting, n = 40) -->
  <text x="36" y="34" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Pod Alpha: Recruiting (n = 40)</text>

  <!-- L2 Lab: 95% -->
  <rect x="64" y="62" width="64" height="114" rx="4" fill="#1e71d6"/>
  <text x="96" y="54" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">95%</text>

  <!-- Breakpoint wall between L2 and L3 -->
  <line x1="161" y1="52" x2="161" y2="184" stroke="#bd35c2" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="161" y="44" text-anchor="middle" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">Break</text>

  <!-- L3 Habit: 18% -->
  <rect x="194" y="154" width="64" height="22" rx="4" fill="#495f7a"/>
  <text x="226" y="146" text-anchor="middle" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">18%</text>

  <!-- L4 KPI: Flat -->
  <rect x="324" y="170" width="64" height="6" rx="2" fill="#495f7a"/>
  <text x="356" y="162" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Flat</text>

  <!-- Baseline axis Panel 1 -->
  <line x1="36" y1="176" x2="408" y2="176" stroke="#495f7a" stroke-width="2"/>
  <text x="96" y="196" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">L2 Lab</text>
  <text x="226" y="196" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">L3 Habit</text>
  <text x="356" y="196" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">L4 Cycle</text>

  <!-- Mid-frame divider -->
  <line x1="28" y1="216" x2="412" y2="216" stroke="#495f7a" stroke-opacity="0.22" stroke-width="1"/>

  <!-- PANEL 2: Pod Beta (Engineering, n = 45) -->
  <text x="36" y="248" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Pod Beta: Engineering (n = 45)</text>

  <!-- L2 Lab: 91% -->
  <rect x="64" y="274" width="64" height="98" rx="4" fill="#1e71d6"/>
  <text x="96" y="266" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">91%</text>

  <!-- L3 Habit: 78% -->
  <rect x="194" y="288" width="64" height="84" rx="4" fill="#6a55e4"/>
  <text x="226" y="280" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">78%</text>

  <!-- Breakpoint wall between L3 and L4 -->
  <line x1="291" y1="264" x2="291" y2="404" stroke="#bd35c2" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="291" y="256" text-anchor="middle" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">Break</text>

  <!-- L4 KPI: -15% slower (drops below baseline y=372) -->
  <rect x="324" y="372" width="64" height="28" rx="4" fill="#bd35c2"/>
  <text x="356" y="362" text-anchor="middle" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">-15% slower</text>

  <!-- Baseline axis Panel 2 -->
  <line x1="36" y1="372" x2="408" y2="372" stroke="#495f7a" stroke-width="2"/>
  <text x="96" y="424" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">L2 Lab</text>
  <text x="226" y="424" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">L3 Habit</text>
  <text x="356" y="424" text-anchor="middle" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">L4 Cycle</text>
</svg>
