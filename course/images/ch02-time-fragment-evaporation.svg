<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" role="img" aria-label="Contrast between scattered ten-minute time fragments that evaporate into email and rework with zero extra output versus a consolidated cycle-time reduction reinvested into three completed backlog deliverables">
  <defs>
    <linearGradient id="reinvestGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a55e4"/>
      <stop offset="1" stop-color="#bd35c2"/>
    </linearGradient>
  </defs>

  <!-- TOP PANEL: Self-Reported Time Fragments -->
  <text x="28" y="38" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Self-Reported Time Fragments</text>
  <text x="412" y="38" text-anchor="end" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">0 net backlog gain</text>

  <!-- Evaporation wisps rising from scattered 10m slivers -->
  <line x1="68" y1="104" x2="68" y2="66" stroke="#1e71d6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="132" y1="104" x2="132" y2="66" stroke="#1e71d6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="198" y1="104" x2="198" y2="66" stroke="#1e71d6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="264" y1="104" x2="264" y2="66" stroke="#1e71d6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="328" y1="104" x2="328" y2="66" stroke="#1e71d6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="384" y1="104" x2="384" y2="66" stroke="#1e71d6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="220" y="60" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Six 10m slivers absorbed by email, chat, and debugging</text>

  <!-- Fragmented 8-hour workday strip -->
  <rect x="28" y="108" width="384" height="48" rx="5" fill="#082445" fill-opacity="0.12" stroke="#495f7a" stroke-width="1.5"/>

  <!-- Active work blocks + 6 scattered 10m blue slivers -->
  <rect x="32" y="112" width="28" height="40" rx="2" fill="#082445"/>
  <rect x="61" y="112" width="14" height="40" rx="2" fill="#1e71d6"/>
  <rect x="78" y="112" width="46" height="40" rx="2" fill="#495f7a"/>
  <rect x="125" y="112" width="14" height="40" rx="2" fill="#1e71d6"/>
  <rect x="142" y="112" width="48" height="40" rx="2" fill="#082445"/>
  <rect x="191" y="112" width="14" height="40" rx="2" fill="#1e71d6"/>
  <rect x="208" y="112" width="48" height="40" rx="2" fill="#495f7a"/>
  <rect x="257" y="112" width="14" height="40" rx="2" fill="#1e71d6"/>
  <rect x="274" y="112" width="46" height="40" rx="2" fill="#082445"/>
  <rect x="321" y="112" width="14" height="40" rx="2" fill="#1e71d6"/>
  <rect x="338" y="112" width="38" height="40" rx="2" fill="#495f7a"/>
  <rect x="377" y="112" width="14" height="40" rx="2" fill="#1e71d6"/>
  <rect x="394" y="112" width="14" height="40" rx="2" fill="#082445"/>

  <text x="68" y="174" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">10m</text>
  <text x="198" y="174" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">10m</text>
  <text x="328" y="174" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">10m</text>
  <text x="412" y="174" text-anchor="end" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="11">Unchanged cycle</text>

  <!-- Mid-frame divider -->
  <line x1="28" y1="204" x2="412" y2="204" stroke="#495f7a" stroke-opacity="0.22" stroke-width="1"/>

  <!-- BOTTOM PANEL: Consolidated Workflow Capacity -->
  <text x="28" y="236" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Redesigned End-to-End Cycle</text>
  <text x="412" y="236" text-anchor="end" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">Verified capacity</text>

  <!-- Prior baseline reference bar -->
  <rect x="28" y="254" width="384" height="22" rx="3" fill="#495f7a" fill-opacity="0.18"/>
  <text x="220" y="269" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Pre-rollout baseline: 8.0h end-to-end cycle</text>

  <!-- Compressed cycle + contiguous freed block -->
  <rect x="28" y="286" width="190" height="48" rx="4" fill="#082445"/>
  <text x="123" y="315" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">4.0h verified delivery</text>

  <rect x="222" y="286" width="190" height="48" rx="4" fill="url(#reinvestGrad)"/>
  <text x="317" y="315" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">4.0h contiguous block</text>

  <!-- Routing connectors from freed block into concrete reinvested deliverables -->
  <line x1="317" y1="334" x2="317" y2="352" stroke="#bd35c2" stroke-width="2.5"/>
  <line x1="100" y1="352" x2="356" y2="352" stroke="#bd35c2" stroke-width="2"/>
  <line x1="100" y1="352" x2="100" y2="368" stroke="#bd35c2" stroke-width="2"/>
  <line x1="228" y1="352" x2="228" y2="368" stroke="#bd35c2" stroke-width="2"/>
  <line x1="356" y1="352" x2="356" y2="368" stroke="#bd35c2" stroke-width="2"/>

  <!-- Reinvested output units -->
  <rect x="44" y="368" width="112" height="42" rx="4" fill="#1e71d6"/>
  <text x="100" y="394" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">+Backlog cases</text>

  <rect x="172" y="368" width="112" height="42" rx="4" fill="#6a55e4"/>
  <text x="228" y="394" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">+Test coverage</text>

  <rect x="300" y="368" width="112" height="42" rx="4" fill="#bd35c2"/>
  <text x="356" y="394" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">+Client outreach</text>
</svg>
